services:
  - type: web
    name: fathershops-catalog-api
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: FatherShops Catalog API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate with: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Public URL of this service, e.g. https://fathershops-catalog-api.onrender.com
      - key: APP_URL
        sync: false
      # URL of the deployed storefront, e.g. https://your-app.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
